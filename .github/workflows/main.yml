name: Build GJ Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed GJ Store APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      # 4. Restore Android wrapper if missing
      - name: Restore Android project files
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then

            echo "Android Gradle wrapper missing."
            echo "Generating Android platform files..."

            rm -rf /tmp/flutter_android

            flutter create \
              --platforms=android \
              --org com.gehendra \
              --project-name gj_store_app \
              /tmp/flutter_android

            cp -R /tmp/flutter_android/android/. android/

            echo "Android files restored."
          fi

      # 5. Configure AGP / Kotlin / Gradle
      - name: Configure Gradle versions
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")

          if settings.exists():
              s = settings.read_text()

              s = re.sub(
                  r'(id\s+"com\.android\.application"\s+version\s+")[^"]+(")',
                  r'\g<1>8.9.1\g<2>',
                  s
              )

              s = re.sub(
                  r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+")[^"]+(")',
                  r'\g<1>2.1.0\g<2>',
                  s
              )

              settings.write_text(s)

          wrapper = Path(
              "android/gradle/wrapper/gradle-wrapper.properties"
          )

          if wrapper.exists():
              s = wrapper.read_text()

              s = re.sub(
                  r'^distributionUrl=.*$',
                  r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip',
                  s,
                  flags=re.MULTILINE
              )

              wrapper.write_text(s)
          PY

          chmod +x android/gradlew

      # 6. Restore release keystore from GitHub Secrets
      - name: Create signing key.properties
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/gj-store-release.jks

          test -s android/gj-store-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=gj-store-release.jks
          EOF

          echo "Signing configuration created."

      # 7. Verify keystore before build
      - name: Verify release keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore android/gj-store-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore verification successful."

      # 8. Flutter dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 9. Clean
      - name: Flutter clean
        run: flutter clean

      # 10. Dependencies again
      - name: Flutter pub get after clean
        run: flutter pub get

      # 11. Build signed APK
      - name: Build signed release APK
        run: |
          flutter build apk --release

      # 12. Check APK exists
      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # 13. Find apksigner automatically
      - name: Find Android APK signer
        shell: bash
        run: |
          set -e

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$APKSIGNER"

      # 14. Verify APK signature
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "APK signature verification PASSED."

      # 15. Verify APK package
      - name: Verify APK package
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" \
            dump badging "$APK" | head -20

          echo "APK package verification PASSED."

      # 16. Prepare final APK
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/GJ-Store-App-Signed.apk

          ls -lh release/GJ-Store-App-Signed.apk

      # 17. Upload signed APK
      - name: Upload signed APK
        uses: actions/upload-artifact@v5
        with:
          name: GJ-Store-App-Signed
          path: release/GJ-Store-App-Signed.apk
          if-no-files-found: error
          retention-days: 30
